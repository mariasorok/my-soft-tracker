<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my soft tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #fcf6f6;
    --text-main: #6b5757;
    --text-light: #a38d8d;
    --card-bg: #ffffff;
    --pink-light: #fbe4e6;
    --pink-main: #eba5ad;
    --pink-dark: #cd8189;
    --blue-light: #e0f2fe;
    --blue-main: #7dd3fc;
    --blue-dark: #38bdf8;
    --green-light: #ebf1ea;
    --green-main: #a3c2a1;
    --border-color: #f2e6e7;
    --font-hand: 'Caveat', cursive;
    --font-sans: 'Nunito', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: var(--font-sans);
    background-color: var(--bg-color);
    background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--text-main);
    padding: 16px 16px 60px;
    max-width: 900px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Верхняя панель */
  .top-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }
  
  .top-bar { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    padding: 0 4px; 
  }
  
  .clock-container { 
    font-family: var(--font-hand); 
    font-size: 38px; 
    color: var(--text-main); 
  }
  
  .settings-btn { background: transparent; border: none; cursor: pointer; opacity: 0.5; transition: opacity 0.2s; padding: 4px; }
  .settings-btn:hover { opacity: 1; }
  .settings-btn svg { width: 28px; height: 28px; stroke: var(--text-main); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  /* Аффирмация (тонкая и ненавязчивая) */
  .affirmation-top {
    text-align: center;
    font-family: var(--font-sans);
    font-weight: 300;
    font-size: 14px;
    color: #b89b9b; /* приглушенный розово-серый */
    letter-spacing: 0.5px;
    font-style: italic;
    padding: 0 10px;
  }

  .tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .tab-btn { font-family: var(--font-sans); font-weight: 600; font-size: 15px; padding: 10px 20px; border: 2px solid transparent; border-radius: 20px; background: transparent; color: var(--text-light); cursor: pointer; transition: all 0.2s; }
  .tab-btn:hover { color: var(--text-main); }
  .tab-btn.active { background: var(--card-bg); color: var(--pink-dark); border-color: var(--pink-light); box-shadow: 0 4px 10px rgba(216, 150, 160, 0.1); }

  .screen { display: none; animation: fadeIn 0.3s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .card { background: var(--card-bg); border-radius: 24px; padding: 24px; margin-bottom: 16px; border: 2px solid var(--border-color); box-shadow: 0 6px 16px rgba(92, 74, 74, 0.04); }
  .title { font-family: var(--font-hand); font-size: 32px; }
  .month-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 16px; }
  .month-nav button { background: none; border: none; font-size: 24px; color: var(--text-light); cursor: pointer; transition: color 0.2s; padding: 0 10px; }
  .month-nav button:hover { color: var(--pink-dark); }
  .month-nav .title { margin: 0; min-width: 150px; text-align: center; font-family: var(--font-sans); font-weight: 700; font-size: 22px;}

  .days-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .day-card { border: 2px solid var(--border-color); border-radius: 16px; padding: 12px; position: relative; background: #fffdfd; transition: all 0.2s; display: flex; align-items: center; gap: 12px; }
  .day-card:active { transform: scale(0.98); }
  .day-card.today { border-color: var(--pink-main); background: #fffafb; }
  .day-num { font-family: var(--font-sans); font-weight: 700; font-size: 16px; color: var(--text-main); min-width: 24px; text-align: center; }
  .day-heart { position: absolute; top: 8px; right: 10px; font-size: 12px; color: var(--border-color); }
  .day-card.done .day-heart { color: var(--pink-main); }

  .drops-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; justify-items: center; }
  .drop { width: 22px; height: 22px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2.5px solid var(--blue-main); cursor: pointer; transition: all 0.15s; background: transparent; position: relative; overflow: hidden; }
  .drop:hover { background: var(--blue-light); }
  .drop .water-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: var(--blue-main); transition: height 0.3s ease; }
  .drop.full .water-fill { height: 100%; }
  .drop.full { border-color: var(--blue-dark); animation: pop 0.3s ease; }
  @keyframes pop { 0% { transform: rotate(-45deg) scale(0.8); } 50% { transform: rotate(-45deg) scale(1.15); } 100% { transform: rotate(-45deg) scale(1); } }

  .sport-table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; text-align: center; }
  .sport-table th { font-family: var(--font-sans); font-weight: 600; font-size: 12px; color: var(--text-light); padding: 12px 2px; border-bottom: 2px solid var(--border-color); word-wrap: break-word; }
  .sport-table th:first-child { text-align: left; padding-left: 10px; width: 50px; }
  .sport-table td { padding: 10px 2px; border-bottom: 1px dashed var(--border-color); font-size: 15px; font-weight: 600; color: var(--text-main); }
  .sport-table td:first-child { text-align: left; padding-left: 10px; }
  .sport-check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--green-main); cursor: pointer; transition: all 0.15s; background: transparent; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; margin: 0 auto; }
  .sport-check:hover { background: var(--green-light); }
  .sport-check.full { background: var(--green-main); border-color: #8cb88c; animation: pop 0.3s ease; }

  .pill-table { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 24px; }
  .pill-table th { font-family: var(--font-sans); font-weight: 600; font-size: 13px; color: var(--text-light); padding: 10px; text-align: center; border-bottom: 2px solid var(--border-color); }
  .pill-table th:first-child { text-align: left; }
  .pill-table td { padding: 12px 10px; border-bottom: 1px dashed var(--border-color); text-align: center; vertical-align: middle; font-size: 15px; }
  .pill-table td:first-child { text-align: left; font-weight: 600; }
  .pill-check { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--pink-main); background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: white; font-size: 14px; transition: all 0.2s; margin: 0 auto; }
  .pill-check.checked { background: var(--pink-main); animation: pop 0.3s ease; }
  .pill-del { background: none; border: none; color: var(--text-light); cursor: pointer; font-size: 18px; padding: 4px 8px; transition: color 0.2s; }
  .pill-del:hover { color: var(--pink-dark); }
  
  .pill-add-box { display: flex; flex-direction: column; gap: 12px; background: var(--bg-color); padding: 16px; border-radius: 16px; width: 100%; }
  .pill-add-box input, .pill-add-box select { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 12px; font-family: var(--font-sans); font-size: 14px; outline: none; background: white; }
  .pill-add-box input:focus, .pill-add-box select:focus { border-color: var(--pink-main); }
  .pill-add-box button { width: 100%; padding: 12px; border: none; border-radius: 12px; background: var(--pink-main); color: white; font-family: var(--font-sans); font-weight: 700; font-size: 16px; cursor: pointer; transition: background 0.2s; }
  .pill-add-box button:hover { background: var(--pink-dark); }

  .who-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-left: 8px; }
  .who-me { background: var(--pink-light); color: var(--pink-dark); }
  .who-kid { background: var(--green-light); color: var(--green-main); }
  .pill-progress-wrap { width: 100%; height: 6px; background: #eee; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .pill-progress-bar { height: 100%; background: var(--pink-main); width: 0%; transition: width 0.3s; }
  .pill-duration-text { font-size: 11px; color: var(--text-light); margin-top: 4px; display: block; font-weight: normal; }

  .mood-circle { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border-color); background: white; display: inline-block; cursor: pointer; transition: all 0.15s; margin: 0 auto; }
  .mood-circle:hover { border-color: var(--text-light); }
  .mood-circle.filled { animation: pop 0.3s ease; }
  .note-btn { position: absolute; bottom: 10px; right: 10px; font-size: 14px; color: var(--text-light); cursor: pointer; transition: color 0.2s; background: none; border: none; padding: 4px; }
  .note-btn:hover { color: var(--pink-dark); }
  .note-btn.has-note { color: var(--pink-dark); }

  .monthly-summary { margin-top: 24px; padding: 20px; background: var(--bg-color); border-radius: 16px; text-align: center; border: 2px dashed var(--border-color); }
  .monthly-summary h3 { font-family: var(--font-hand); font-size: 28px; color: var(--pink-dark); margin-bottom: 8px; }
  .monthly-summary p { font-size: 15px; color: var(--text-main); line-height: 1.5; }
  .monthly-summary .quote { font-style: italic; color: var(--text-light); margin-top: 12px; font-size: 14px; }

  .plans-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .plan-item { display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--bg-color); border-radius: 16px; border: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
  .plan-item:hover { border-color: var(--border-color); }
  .plan-item.done { opacity: 0.6; text-decoration: line-through; background: transparent; border: 2px dashed var(--border-color); }
  .plan-check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--pink-main); background: transparent; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; flex-shrink: 0; transition: all 0.2s; }
  .plan-item.done .plan-check { background: var(--pink-main); }
  .plan-text { flex: 1; font-size: 16px; font-weight: 600; }
  .plan-del { background: none; border: none; color: var(--text-light); font-size: 18px; cursor: pointer; padding: 4px; }
  .plan-del:hover { color: #ef4444; }
  .plans-add-box { display: flex; gap: 8px; width: 100%; }
  .plans-add-box input { flex: 1; padding: 14px; border: 2px solid var(--border-color); border-radius: 12px; font-family: var(--font-sans); font-size: 16px; outline: none; width: 100%; }
  .plans-add-box input:focus { border-color: var(--pink-main); }
  .plans-add-box button { padding: 0 20px; border: none; border-radius: 12px; background: var(--pink-main); color: white; font-weight: 700; font-size: 20px; cursor: pointer; }

  .settings-list { display: flex; flex-direction: column; gap: 12px; }
  .settings-item { background: var(--bg-color); border-radius: 16px; padding: 16px; display: flex; align-items: center; justify-content: space-between; }
  .settings-item span { font-weight: 600; font-size: 16px; }
  .settings-btn-action { background: white; border: 2px solid var(--border-color); padding: 8px 16px; border-radius: 12px; font-family: var(--font-sans); font-weight: 700; font-size: 14px; color: var(--text-main); cursor: pointer; transition: all 0.2s; }
  .settings-btn-action:hover { border-color: var(--pink-main); color: var(--pink-dark); }

  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: white; border-radius: 20px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 2px solid var(--border-color); text-align: center; }
  .modal-title { font-family: var(--font-hand); font-size: 32px; margin-bottom: 16px; color: var(--text-main); }
  .modal-note { text-align: left; }
  .modal-note textarea { width: 100%; height: 120px; padding: 12px; border: 2px solid var(--border-color); border-radius: 12px; font-family: var(--font-sans); font-size: 14px; outline: none; resize: none; background: var(--bg-color); color: var(--text-main); margin-bottom: 16px; }
  .modal-note textarea:focus { border-color: var(--pink-main); }
  .mood-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .mood-opt-btn { padding: 10px; border-radius: 12px; border: none; cursor: pointer; font-family: var(--font-sans); font-weight: 600; color: var(--text-main); transition: transform 0.1s; }
  .mood-opt-btn:hover { transform: scale(1.02); }
  .modal-actions { display: flex; gap: 10px; justify-content: center; }
  .modal-btn { padding: 10px 20px; border-radius: 12px; border: none; font-family: var(--font-sans); font-weight: 700; font-size: 14px; cursor: pointer; transition: background 0.2s; }
  .modal-btn.cancel { background: var(--bg-color); color: var(--text-main); }
  .modal-btn.danger { background: #fca5a5; color: white; }
  .modal-btn.save { background: var(--pink-main); color: white; }
  .modal-btn.ok { background: var(--pink-main); color: white; padding: 12px 30px; font-size: 16px; }

  @media (max-width: 600px) {
    body { padding: 16px 12px 40px; }
    .clock-container { font-size: 32px; }
    .tabs { gap: 6px; margin-bottom: 16px; }
    .tab-btn { font-size: 12px; padding: 10px 12px; flex: 1 1 30%; text-align: center; }
    .card { padding: 16px; border-radius: 20px; }
    .title { font-size: 26px; }
    .month-nav .title { font-size: 20px !important; min-width: 120px; }
    .days-grid { grid-template-columns: 1fr; gap: 10px; }
    .day-card { padding: 12px; gap: 12px; border-radius: 16px; }
    .day-num { font-size: 16px; min-width: 20px; }
    .drops-grid { gap: 6px; flex: 1; justify-content: space-between; }
    .drop { width: 24px; height: 24px; border-width: 2.5px; }
    .mood-circle { width: 26px; height: 26px; flex: 1; max-width: 30px; }
    .note-btn { bottom: 6px; right: 6px; font-size: 14px; }
    .sport-table th, .sport-table td { padding: 10px 2px; font-size: 11px; }
    .sport-check { width: 26px; height: 26px; font-size: 13px; }
    .pill-table th, .pill-table td { padding: 10px 4px; font-size: 13px; }
    .pill-check { width: 28px; height: 28px; font-size: 14px; }
    .pill-del { font-size: 20px; padding: 4px; }
    .who-badge { font-size: 10px; padding: 2px 6px; margin-left: 4px; display: block; width: fit-content; margin-top: 4px; }
    .pill-add-box input, .pill-add-box select, .pill-add-box button { font-size: 16px; padding: 14px; }
    .monthly-summary { padding: 16px; margin-top: 16px; }
    .monthly-summary h3 { font-size: 24px; }
    .monthly-summary p { font-size: 15px; }
  }
</style>
</head>

<body>

<div class="top-section">
  <div class="top-bar" id="mainTopBar">
    <div class="clock-container" id="liveClock">--:--</div>
    <button class="settings-btn" onclick="toggleSettings(true)" title="настройки">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>
  
  <!-- Аффирмация на день (по центру, тонкая) -->
  <div class="affirmation-top" id="affirmationText">загрузка...</div>
</div>

<div class="screen" id="screen-settings">
  <div class="top-bar">
    <div class="clock-container">настройки</div>
    <button class="settings-btn" onclick="toggleSettings(false)" title="закрыть">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>
  <div class="card">
    <div class="settings-list">
      <div class="settings-item">
        <span>звуки</span>
        <button class="settings-btn-action" id="soundSettingsBtn" onclick="unlockAudio()">включить</button>
      </div>
      <div class="settings-item">
        <span>резервная копия</span>
        <div style="display:flex; gap: 8px;">
          <button class="settings-btn-action" onclick="exportData()">экспорт</button>
          <button class="settings-btn-action" onclick="document.getElementById('importFile').click()">импорт</button>
        </div>
        <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
      </div>
    </div>
  </div>
</div>

<div id="mainTabs" class="tabs">
  <button class="tab-btn active" onclick="switchTab('plans')">дела</button>
  <button class="tab-btn" onclick="switchTab('pills')">таблетки</button>
  <button class="tab-btn" onclick="switchTab('water')">вода</button>
  <button class="tab-btn" onclick="switchTab('sport')">спорт</button>
  <button class="tab-btn" onclick="switchTab('mood')">настроение</button>
</div>

<!-- ЭКРАН ДЕЛА -->
<div id="screen-plans" class="screen active">
  <div class="card">
    <div class="month-nav">
      <button onclick="changePlanDay(-1)">←</button>
      <div class="title" id="planDateDisplay" style="font-size: 24px;">сегодня</div>
      <button onclick="changePlanDay(1)">→</button>
    </div>
    <div class="plans-list" id="plansList"></div>
    <div class="plans-add-box">
      <input type="text" id="planInput" placeholder="что нужно сделать?" />
      <button onclick="addPlan()">+</button>
    </div>
  </div>
</div>

<!-- ЭКРАН ТАБЛЕТКИ -->
<div id="screen-pills" class="screen">
  <div class="card">
    <div class="month-nav">
      <button onclick="changePillDay(-1)">←</button>
      <div class="title" id="pillDateDisplay" style="font-size: 24px;">сегодня</div>
      <button onclick="changePillDay(1)">→</button>
    </div>

    <table class="pill-table">
      <thead>
        <tr>
          <th>лекарство</th>
          <th>утро</th>
          <th>день</th>
          <th>вечер</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="pillsTableBody"></tbody>
    </table>

    <div class="pill-add-box">
      <select id="pillPerson">
        <option value="me">для меня</option>
        <option value="kid">для Кирочки</option>
      </select>
      <input type="text" id="pillInput" placeholder="название лекарства..." />
      <div style="display: flex; gap: 8px;">
        <select id="pillFrequency" style="flex: 1;">
          <option value="1">1 раз в день</option>
          <option value="2">2 раза в день</option>
          <option value="3">3 раза в день</option>
        </select>
        <input type="number" id="pillDuration" placeholder="дней" min="0" style="flex: 1;" />
      </div>
      <button onclick="addPill()">добавить</button>
    </div>
  </div>
</div>

<!-- ЭКРАН ВОДА -->
<div id="screen-water" class="screen">
  <div class="card">
    <div class="month-nav">
      <button onclick="changeMonth('water', -1)">←</button>
      <div class="title" id="waterMonthTitle">ноябрь</div>
      <button onclick="changeMonth('water', 1)">→</button>
    </div>
    <div class="days-grid" id="waterGrid"></div>
    <div class="monthly-summary" id="waterSummary"></div>
  </div>
</div>

<!-- ЭКРАН СПОРТ -->
<div id="screen-sport" class="screen">
  <div class="card">
    <div class="month-nav">
      <button onclick="changeMonth('sport', -1)">←</button>
      <div class="title" id="sportMonthTitle">ноябрь</div>
      <button onclick="changeMonth('sport', 1)">→</button>
    </div>
    <div style="overflow-x: auto;">
      <table class="sport-table">
        <thead>
          <tr>
            <th>день</th>
            <th>йога утро</th>
            <th>тренировка</th>
            <th>спина</th>
            <th>йога вечер</th>
          </tr>
        </thead>
        <tbody id="sportTableBody"></tbody>
      </table>
    </div>
    <div class="monthly-summary" id="sportSummary"></div>
  </div>
</div>

<!-- ЭКРАН НАСТРОЕНИЕ -->

    <div class="month-nav">
      <button onclick="changeMonth('mood', -1)">←</button>

    <div class="modal-title" id="modalDateTitle">заметка</div>

<div class="modal-overlay" id="congratsModal">
  <div class="modal">
    <div class="modal-title" id="congratsTitle">ты молодец!</div>

  <div class="modal">
    <div class="modal-title">удалить таблетку?</div>
    <p style="margin-bottom: 24px; font-size: 15px; color: var(--text-light);">все отметки за прошлые дни тоже сотрутся. ты уверена?</p>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeConfirmDelete()">отмена</button>
      <button class="modal-btn danger" onclick="confirmDelete()">удалить</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'soft-tracker-v27';
  let state = load();
  let editingNoteDate = null;
  let selectingMoodDate = null;
  let deletingPillId = null;
  
  let viewDate = new Date();
  let pillDate = new Date();
  let planDate = new Date();

  const MOODS = [
    { id: 'energetic', label: 'энергичное', color: '#cdb4f6', adj: 'энергичной', quote: 'энергия - это то, что ты создаешь сама.' },
    { id: 'happy',     label: 'счастливое', color: '#bde0f5', adj: 'счастливой', quote: 'счастье - это выбор, который ты делаешь каждый день.' },
    { id: 'calm',      label: 'спокойное',  color: '#c6e6b8', adj: 'спокойной', quote: 'в тишине и спокойствии рождается ясность.' },
    { id: 'neutral',   label: 'нейтральное',color: '#fdf1b8', adj: 'нейтральной', quote: 'нейтральность - это тоже баланс. и это нормально.' },
    { id: 'anxious',   label: 'тревожное',  color: '#fce1b6', adj: 'тревожной', quote: 'тревога - это просто твоя забота, которая ищет выход.' },
    { id: 'sad',       label: 'грустное',   color: '#f6c5c5', adj: 'грустной', quote: 'грусть - это дверь к исцелению. позволь себе чувствовать.' },
    { id: 'angry',     label: 'злое',       color: '#f5b0b8', adj: 'злой', quote: 'злость - это энергия для перемен. направь ее в нужное русло.' },
  ];

  const MONTHS_RU = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];

  const AFFIRMATIONS = [
    "я выбираю себя и свое спокойствие.", "я делаю все, что в моих силах, и этого достаточно.", "моя жизнь течет в правильном направлении.", "я позволяю себе отдыхать без чувства вины.", "каждый день я становлюсь чуточку счастливее.", "я отпускаю то, что не приносит мне радости.", "я достойна любви и заботы, особенно от самой себя.", "мой внутренний мир — это моя безопасная гавань.", "я принимаю свои эмоции, даже если они сложные.", "я верю в свой путь и свои силы.", "я создаю пространство для хороших перемен.", "маленькие шаги ведут к большим результатам.", "я благодарна своему телу за то, что оно меня носит.", "я не обязана быть идеальной, я просто должна быть собой.", "я выбираю мир в своей душе.", "я умею справляться с трудностями и становлюсь сильнее.", "сегодня я найду повод улыбнуться.", "я разрешаю себе быть там, где я сейчас нахожусь.", "я заслуживаю всего самого лучшего.", "мои границы важны и я их уважаю.", "я вдыхаю спокойствие, а выдыхаю напряжение.", "я — творец своей собственной жизни.", "я учусь на своих ошибках и двигаюсь дальше.", "я окружена заботой и поддержкой.", "я отпускаю контроль и доверяю течению жизни.", "я сильная, я справлюсь.", "я замечаю красоту в простых вещах.", "я делаю сегодня то, что скажет мне спасибо завтра.", "моя энергия направлена на то, что я могу изменить.", "я завершаю этот день с чувством благодарности.", "я начинаю новый месяц с чистого листа.",
  ];

  function updateClock() {
    const now = new Date();
    document.getElementById('liveClock').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    
    // Устанавливаем аффирмацию дня
    const dayOfMonth = now.getDate();
    const affirmationIndex = (dayOfMonth - 1) % AFFIRMATIONS.length;
    const affEl = document.getElementById('affirmationText');
    if (affEl) affEl.textContent = AFFIRMATIONS[affirmationIndex];
  }
  setInterval(updateClock, 1000);
  updateClock();

  let audioCtx = null;
  let isAudioUnlocked = false;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function unlockAudio() {
    initAudio();
    if (audioCtx) {
      const buffer = audioCtx.createBuffer(1, 1, 22050);
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start(0);
      isAudioUnlocked = true;
      
      const btn = document.getElementById('soundSettingsBtn');
      if(btn) {
        btn.textContent = 'включено ✓';
        btn.style.color = 'var(--green-main)';
        btn.style.borderColor = 'var(--green-main)';
      }
      
      playSound('success');
      alert('звук включен! теперь все кнопки будут звучать.');
    }
  }

  document.addEventListener('touchstart', function() {
    if (!isAudioUnlocked) {
      initAudio();
      const buffer = audioCtx.createBuffer(1, 1, 22050);
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start(0);
      isAudioUnlocked = true;
      const btn = document.getElementById('soundSettingsBtn');
      if(btn) {
        btn.textContent = 'включено ✓';
        btn.style.color = 'var(--green-main)';
        btn.style.borderColor = 'var(--green-main)';
      }
    }
  }, { once: true });

  function playSound(type) {
    initAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'click') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
      gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'success') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554, now + 0.1); osc.frequency.setValueAtTime(659, now + 0.2);
      gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      osc.start(now); osc.stop(now + 0.4);
    }
  }

  function dateToKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function todayKey() { return dateToKey(new Date()); }

  function defaultState() { return { plans: {}, water: {}, pills: [], pillsDone: {}, sport: {}, mood: {}, notes: {} }; }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? Object.assign(defaultState(), JSON.parse(raw)) : defaultState();
    } catch { return defaultState(); }
  }

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

  function toggleSettings(show) {
    playSound('click');
    const mainTabs = document.getElementById('mainTabs');
    const screens = document.querySelectorAll('.screen');
    const settingsScreen = document.getElementById('screen-settings');
    const topSection = document.querySelector('.top-section');

    if (show) {
      mainTabs.style.display = 'none';
      topSection.style.display = 'none';
      screens.forEach(s => s.classList.remove('active'));
      settingsScreen.classList.add('active');
      settingsScreen.classList.add('screen');
    } else {
      mainTabs.style.display = 'flex';
      topSection.style.display = 'flex';
      settingsScreen.classList.remove('active');
      switchTab('plans');
    }
  }

  function switchTab(tabName) {
    playSound('click');
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(scr => scr.classList.remove('active'));
    const btns = document.querySelectorAll('.tab-btn');
    ['plans', 'pills', 'water', 'sport', 'mood'].forEach((name, i) => {
      if (name === tabName) btns[i].classList.add('active');
    });
    document.getElementById('screen-' + tabName).classList.add('active');
    
    if (tabName !== 'plans' && tabName !== 'pills') {
      setTimeout(() => {
        const todayCard = document.querySelector(`#screen-${tabName} .day-card.today`) || document.querySelector(`#screen-${tabName} .today-row`);
        if (todayCard) {
          todayCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 100);
    }

    if (tabName === 'mood') renderMood();
    if (tabName === 'sport') renderSport();
    if (tabName === 'water') renderWater();
    if (tabName === 'pills') renderPills();
    if (tabName === 'plans') renderPlans();
  }

  function changeMonth(section, direction) {
    playSound('click');
    viewDate.setMonth(viewDate.getMonth() + direction);
    if (section === 'water') renderWater();
    if (section === 'sport') renderSport();
    if (section === 'mood') renderMood();
    
    setTimeout(() => {
      const todayCard = document.querySelector(`#screen-${section} .day-card.today`) || document.querySelector(`#screen-${section} .today-row`);
      if (todayCard) todayCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
  }

  function changePillDay(direction) {
    playSound('click');
    pillDate.setDate(pillDate.getDate() + direction);
    renderPills();
  }

  function changePlanDay(direction) {
    playSound('click');
    planDate.setDate(planDate.getDate() + direction);
    renderPlans();
  }

    // --- ДЕЛА ---
  function renderPlans() {
    const list = document.getElementById('plansList');
    const pDateStr = dateToKey(planDate);
    const todayStr = todayKey();
    document.getElementById('planDateDisplay').textContent = pDateStr === todayStr ? 'сегодня' : pDateStr;
    
    const dayPlans = state.plans[pDateStr] || [];
    
    if (dayPlans.length === 0) {
      list.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-light); font-style: italic;">на этот день дел нет</div>`;
      return;
    }
    list.innerHTML = dayPlans.map((p, index) => `
      <div class="plan-item ${p.done ? 'done' : ''}" onclick="togglePlan('${pDateStr}', ${index})">
        <div class="plan-check">${p.done ? '✓' : ''}</div>
        <div class="plan-text">${escapeHtml(p.text)}</div>
        <button class="plan-del" onclick="deletePlan(event, '${pDateStr}', ${index})">✕</button>
      </div>
    `).join('');
  }

  function addPlan() {
    const input = document.getElementById('planInput');
    const text = input.value.trim();
    const pDateStr = dateToKey(planDate);
    if (!text) return;
    if (!state.plans[pDateStr]) state.plans[pDateStr] = [];
    state.plans[pDateStr].push({ text, done: false });
    input.value = '';
    playSound('click');
    save();
    renderPlans();
  }

  function togglePlan(dateStr, index) {
    if (state.plans[dateStr] && state.plans[dateStr][index]) {
      state.plans[dateStr][index].done = !state.plans[dateStr][index].done;
      playSound('click');
      save();
      renderPlans();
    }
  }

  function deletePlan(event, dateStr, index) {
    event.stopPropagation();
    if (state.plans[dateStr]) {
      state.plans[dateStr].splice(index, 1);
      if (state.plans[dateStr].length === 0) delete state.plans[dateStr];
      playSound('click');
      save();
      renderPlans();
    }
  }

  // --- ВОДА ---
  function renderWater() {
    const container = document.getElementById('waterGrid');
    const todayStr = todayKey();
    const currentMonth = viewDate.getMonth();
    const currentYear = viewDate.getFullYear();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    
    document.getElementById('waterMonthTitle').textContent = MONTHS_RU[currentMonth];
    let html = '';
    let daysWithWater = 0;
    
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const drops = state.water[dateStr] || [];
      const count = drops.filter(d => d === 1).length;
      const isDone = count >= 8;
      const isToday = dateStr === todayStr;
      if (isDone) daysWithWater++;
      
      html += `<div class="day-card ${isToday ? 'today' : ''} ${isDone ? 'done' : ''}">
        <span class="day-num">${day}</span>
        <span class="day-heart">♡</span>
        <div class="drops-grid">`;
      for (let i = 0; i < 8; i++) {
        const isFull = drops[i] === 1;
        html += `<div class="drop ${isFull ? 'full' : ''}" onclick="toggleDrop('${dateStr}', ${i})"><div class="water-fill"></div></div>`;
      }
      html += `</div></div>`;
    }
    container.innerHTML = html;

    let summaryText = '';
    if (daysWithWater === daysInMonth) summaryText = 'в этом месяце ты молодец! каждый день пила столько воды, сколько нужно. это невероятная забота о себе!';
    else if (daysWithWater > daysInMonth / 2) summaryText = `в этом месяце ты выпила норму воды ${daysWithWater} дней из ${daysInMonth}. отличный результат, продолжай в том же духе!`;
    else summaryText = `в этом месяце не получилось на 100%, но это нормально. норма воды выполнена ${daysWithWater} дней. не сдавайся!`;
    document.getElementById('waterSummary').innerHTML = `<h3>итоги месяца</h3><p>${summaryText}</p>`;
  }

  function toggleDrop(dateStr, index) {
    initAudio();
    if (!state.water[dateStr]) state.water[dateStr] = Array(8).fill(0);
    const currentlyFilled = state.water[dateStr].filter(d => d === 1).length;
    const wasDone = currentlyFilled >= 8;
    if (index + 1 > currentlyFilled) {
      for (let i = 0; i <= index; i++) state.water[dateStr][i] = 1;
    } else {
      state.water[dateStr][index] = state.water[dateStr][index] === 1 ? 0 : 1;
    }
    playSound('click');
    save();
    renderWater();
    const nowDone = state.water[dateStr].filter(d => d === 1).length >= 8;
    if (nowDone && !wasDone) setTimeout(() => showCongrats('ты молодец!', 'ты выпила все 8 стаканов воды за сегодня. водичка - это сила!'), 400);
  }

  // --- СПОРТ ---
  const SPORT_KEYS = ['morning', 'workout', 'back', 'evening'];
  function renderSport() {
    const tbody = document.getElementById('sportTableBody');
    const todayStr = todayKey();
    const currentMonth = viewDate.getMonth();
    const currentYear = viewDate.getFullYear();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    document.getElementById('sportMonthTitle').textContent = MONTHS_RU[currentMonth];
    let html = '';
    let daysWithAllSport = 0;
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const sportData = state.sport[dateStr] || {};
      const isToday = dateStr === todayStr;
      const doneCount = Object.values(sportData).filter(v => v === 1).length;
      if (doneCount === 4) daysWithAllSport++;
      html += `<tr class="${isToday ? 'today-row' : ''}" style="${isToday ? 'background-color: var(--green-light);' : ''}"><td>${day}</td>`;
      SPORT_KEYS.forEach(key => {
        const isFull = sportData[key] === 1;
        html += `<td><div class="sport-check ${isFull ? 'full' : ''}" onclick="toggleSport('${dateStr}', '${key}')">${isFull ? '✓' : ''}</div></td>`;
      });
      html += `</tr>`;
    }
    tbody.innerHTML = html;

    let summaryText = '';
    if (daysWithAllSport === daysInMonth) summaryText = 'ты выполнила все тренировки в этом месяце! невероятная дисциплина и забота о теле.';
    else if (daysWithAllSport > daysInMonth / 2) summaryText = `ты отлично потренировалась! полностью выполнено ${daysWithAllSport} дней из ${daysInMonth}. тело скажет спасибо.`;
    else summaryText = `в этом месяце не получилось на все 100%, но это нормально. полностью выполнено ${daysWithAllSport} дней. главное - продолжать!`;
    document.getElementById('sportSummary').innerHTML = `<h3>итоги месяца</h3><p>${summaryText}</p>`;
  }

  function toggleSport(dateStr, key) {
    initAudio();
    if (!state.sport[dateStr]) state.sport[dateStr] = {};
    const wasDone = Object.values(state.sport[dateStr]).filter(v => v === 1).length === 4;
    state.sport[dateStr][key] = state.sport[dateStr][key] === 1 ? 0 : 1;
    save();
    const doneCount = Object.values(state.sport[dateStr]).filter(v => v === 1).length;
    if (doneCount === 4 && !wasDone) setTimeout(() => showCongrats('ты молодец!', 'все тренировки на сегодня выполнены. тело скажет спасибо!'), 300);
    else playSound('click');
    renderSport();
  }

  // --- ТАБЛЕТКИ ---
  function renderPills() {
    const tbody = document.getElementById('pillsTableBody');
    const today = todayKey();
    const pDateStr = dateToKey(pillDate);
    document.getElementById('pillDateDisplay').textContent = pDateStr === today ? 'сегодня' : pDateStr;
    if (state.pills.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-light); font-style:italic; padding: 20px;">добавь первую таблетку ниже</td></tr>`;
      return;
    }
    tbody.innerHTML = state.pills.map(p => {
      const dayData = state.pillsDone[pDateStr]?.[p.id] || {};
      const personLabel = p.person === 'me' ? '<span class="who-badge who-me">я</span>' : '<span class="who-badge who-kid">Кирочка</span>';
      const showMorning = p.freq >= 1;
      const showNoon = p.freq >= 2;
      const showEvening = p.freq >= 3;
      let progressHtml = '';
      if (p.duration > 0) {
        const start = new Date(p.startDate);
        const current = new Date(pDateStr);
        const diffTime = Math.abs(current - start);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        const daysPassed = Math.min(diffDays + 1, p.duration);
        const percent = (daysPassed / p.duration) * 100;
        progressHtml = `<div class="pill-progress-wrap"><div class="pill-progress-bar" style="width: ${percent}%"></div></div><span class="pill-duration-text">день ${daysPassed} из ${p.duration}</span>`;
      }
      return `<tr>
          <td><div>${escapeHtml(p.name)} ${personLabel}</div>${progressHtml}</td>
          <td>${showMorning ? `<button class="pill-check ${dayData.morning ? 'checked' : ''}" onclick="togglePill(${p.id}, 'morning', '${pDateStr}')">${dayData.morning ? '✓' : ''}</button>` : '<span style="color:#eee">-</span>'}</td>
          <td>${showNoon ? `<button class="pill-check ${dayData.noon ? 'checked' : ''}" onclick="togglePill(${p.id}, 'noon', '${pDateStr}')">${dayData.noon ? '✓' : ''}</button>` : '<span style="color:#eee">-</span>'}</td>
          <td>${showEvening ? `<button class="pill-check ${dayData.evening ? 'checked' : ''}" onclick="togglePill(${p.id}, 'evening', '${pDateStr}')">${dayData.evening ? '✓' : ''}</button>` : '<span style="color:#eee">-</span>'}</td>
          <td><button class="pill-del" onclick="askDeletePill(${p.id})" title="удалить">✕</button></td>
        </tr>`;
    }).join('');
  }

  function addPill() {
    initAudio();
    const input = document.getElementById('pillInput');
    const person = document.getElementById('pillPerson').value;
    const freq = parseInt(document.getElementById('pillFrequency').value);
    const durationInput = document.getElementById('pillDuration').value;
    const duration = durationInput ? parseInt(durationInput) : 0;
    
    const name = input.value.trim();
    if (!name) return;
    state.pills.push({ id: Date.now(), name, person, freq, startDate: todayKey(), duration: duration });
    input.value = '';
    document.getElementById('pillDuration').value = '';
    playSound('click');
    save();
    renderPills();
  }

  function askDeletePill(id) {
    deletingPillId = id;
    document.getElementById('confirmDeleteModal').classList.add('open');
  }
  function closeConfirmDelete() {
    document.getElementById('confirmDeleteModal').classList.remove('open');
    deletingPillId = null;
  }
  function confirmDelete() {
    if (!deletingPillId) return;
    state.pills = state.pills.filter(p => p.id !== deletingPillId);
    for (const day in state.pillsDone) { delete state.pillsDone[day][deletingPillId]; }
    save();
    closeConfirmDelete();
    playSound('click');
    renderPills();
  }

  function togglePill(id, timeOfDay, dateStr) {
    initAudio();
    const pill = state.pills.find(p => p.id === id);
    if (!pill) return;
    if (!state.pillsDone[dateStr]) state.pillsDone[dateStr] = {};
    if (!state.pillsDone[dateStr][id]) state.pillsDone[dateStr][id] = {};
    state.pillsDone[dateStr][id][timeOfDay] = !state.pillsDone[dateStr][id][timeOfDay];
    playSound('click');
    save();
    renderPills();
    if (pill.duration > 0) {
      const start = new Date(pill.startDate);
      const end = new Date(start); end.setDate(end.getDate() + pill.duration - 1);
      const currentDate = new Date(dateStr);
      if (currentDate >= end) {
        const todayDone = state.pillsDone[dateStr][id] || {};
        const totalDone = Object.values(todayDone).filter(v => v).length;
        if (totalDone >= pill.freq) {
          setTimeout(() => {
            showCongrats('мы закончили это пить!', `курс "${pill.name}" успешно завершен. он удален из списка.`);
            state.pills = state.pills.filter(p => p.id !== id);
            for (const day in state.pillsDone) { delete state.pillsDone[day][id]; }
            save(); renderPills();
          }, 300);
        }
      }
    }
  }

  // --- НАСТРОЕНИЕ ---
  function renderMood() {
    const grid = document.getElementById('moodGrid');
    const todayStr = todayKey();
    const currentMonth = viewDate.getMonth();
    const currentYear = viewDate.getFullYear();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    document.getElementById('moodMonthTitle').textContent = MONTHS_RU[currentMonth];
    let html = '';
    let moodCounts = {};
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const moodId = state.mood[dateStr];
      const moodData = MOODS.find(m => m.id === moodId);
      const isToday = dateStr === todayStr;
      const hasNote = state.notes[dateStr] && state.notes[dateStr].trim() !== '';
      if (moodId) moodCounts[moodId] = (moodCounts[moodId] || 0) + 1;
      const colorStyle = moodData ? `background-color: ${moodData.color}; border-color: ${moodData.color};` : '';
      html += `<div class="day-card ${isToday ? 'today' : ''}">
        <span class="day-num">${day}</span>
        <div class="mood-circle ${moodData ? 'filled' : ''}" style="${colorStyle}" onclick="openMoodSelect('${dateStr}')"></div>
        <button class="note-btn ${hasNote ? 'has-note' : ''}" onclick="openNote('${dateStr}', ${day})" title="заметка">✎</button>
      </div>`;
    }
    grid.innerHTML = html;
    let summaryText = 'в этом месяце ты пока не отмечала настроение.';
    let quoteText = '';
    let maxMoodId = null; let maxCount = 0;
    for (const [mId, count] of Object.entries(moodCounts)) {
      if (count > maxCount) { maxCount = count; maxMoodId = mId; }
    }
    if (maxMoodId) {
      const moodData = MOODS.find(m => m.id === maxMoodId);
      summaryText = `в этом месяце в большинство дней ты была ${moodData.adj}.`;
      quoteText = moodData.quote;
    }
    document.getElementById('moodSummary').innerHTML = `<h3>итоги месяца</h3><p>${summaryText}</p>${quoteText ? `<p class="quote">"${quoteText}"</p>` : ''}`;
  }

  function openMoodSelect(dateStr) {
    initAudio();
    selectingMoodDate = dateStr;
    const list = document.getElementById('moodOptionsList');
    list.innerHTML = MOODS.map(m => `<button class="mood-opt-btn" style="background-color: ${m.color};" onclick="setMood('${m.id}')">${m.label}</button>`).join('');
    document.getElementById('moodSelectModal').classList.add('open');
  }
  function closeMoodSelect() {
    document.getElementById('moodSelectModal').classList.remove('open');
    selectingMoodDate = null;
  }
  function setMood(moodId) {
    if (!selectingMoodDate) return;
    if (state.mood[selectingMoodDate] === moodId) delete state.mood[selectingMoodDate];
    else state.mood[selectingMoodDate] = moodId;
    playSound('click');
    save();
    closeMoodSelect();
    renderMood();
  }

  function openNote(dateStr, dayNum) {
    editingNoteDate = dateStr;
    document.getElementById('modalDateTitle').textContent = `заметка на ${dayNum} число`;
    document.getElementById('modalNoteText').value = state.notes[dateStr] || '';
    document.getElementById('noteModal').classList.add('open');
  }
  function closeNote() {
    document.getElementById('noteModal').classList.remove('open');
    editingNoteDate = null;
  }
  function saveNote() {
    if (!editingNoteDate) return;
    const text = document.getElementById('modalNoteText').value.trim();
    if (text) state.notes[editingNoteDate] = text;
    else delete state.notes[editingNoteDate];
    save(); closeNote(); renderMood();
  }

  function showCongrats(title, text) {
    document.getElementById('congratsTitle').textContent = title;
    document.getElementById('congratsText').textContent = text;
    document.getElementById('congratsModal').classList.add('open');
    playSound('success');
  }
  function closeCongrats() { document.getElementById('congratsModal').classList.remove('open'); }

  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
    const downloadAnchorNode = document.createElement('a');
    downloadAnchorNode.setAttribute("href", dataStr);
    downloadAnchorNode.setAttribute("download", "my_soft_tracker_backup.json");
    document.body.appendChild(downloadAnchorNode);
    downloadAnchorNode.click();
    downloadAnchorNode.remove();
    playSound('success');
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const imported = JSON.parse(e.target.result);
        state = Object.assign(defaultState(), imported);
        save();
        renderWater();
        renderPills();
        renderSport();
        renderMood();
        renderPlans();
        showCongrats('данные загружены!', 'все твои записи успешно перенесены на это устройство.');
      } catch (err) {
        alert('ошибка: файл поврежден или выбран не тот файл.');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  document.getElementById('planInput').addEventListener('keydown', e => { if (e.key === 'Enter') addPlan(); });
  document.getElementById('pillInput').addEventListener('keydown', e => { if (e.key === 'Enter') addPill(); });

  renderPlans();
  renderWater();
  renderPills();
  renderSport();
</script>
</body>
</html>
